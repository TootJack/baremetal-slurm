# Slurm single-node test configuration (WSL)
ClusterName=testcluster
SlurmctldHost=slurmctld(127.0.0.1)

AuthType=auth/munge
CryptoType=crypto/munge

# --- Accounting (required for QoS) ---
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=127.0.0.1
AccountingStoragePort=6819
AccountingStorageEnforce=associations,qos
JobAcctGatherType=jobacct_gather/cgroup

# --- Scheduler ---
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# --- Priority + QoS + Preemption ---
PriorityType=priority/multifactor
PriorityWeightQOS=1000
PriorityWeightFairshare=100000
PreemptType=preempt/qos
PreemptMode=REQUEUE
JobRequeue=1

# --- Logging ---
SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmdbdDebug=info
SlurmdbdLogFile=/var/log/slurm/slurmdbd.log

# --- Nodes ---
GresTypes=gpu
NodeName=TUE036156 CPUs=20 RealMemory=7000 Gres=gpu:1 State=UNKNOWN

# --- Partitions ---
PartitionName=debug Nodes=ALL Default=YES MaxTime=INFINITE State=UP
